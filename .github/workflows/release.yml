name: release

# Build prebuilt `wingman` binaries for every supported platform and attach
# them to the GitHub Release whenever a `v*` tag is pushed. The install
# script (`scripts/install.sh`) downloads these assets, so users never have
# to clone or run cargo themselves.
#
#   git tag v0.0.1 && git push origin v0.0.1
#
# produces assets named  wingman-<target>.tar.gz  (and .zip on Windows).
#
# Linux targets are gnu, not musl: wingman embeds ONNX Runtime (via
# fastembed/ort) for semantic search, and ort only ships prebuilt binaries
# for glibc — there is no musl build. gnu binaries run on all mainstream
# distros. `install.sh` downloads the matching `unknown-linux-gnu` asset.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the release and upload assets

jobs:
  # Create the GitHub Release once, up front. Without this the matrix jobs
  # race to create it and end up retrying "release not found" forever (which
  # is what stalled earlier release runs for hours).
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60 # never let a stuck job hang the run for hours
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build both Linux targets NATIVELY (no `cross`) on new-glibc
          # runners. ort's prebuilt ONNX Runtime is compiled against glibc
          # >= 2.38 (it references __isoc23_* symbols), so an older runner
          # can't link it and `cross`'s container can't fetch the aarch64
          # binary at all. ubuntu-24.04 (x64) and ubuntu-24.04-arm (aarch64,
          # free on public repos) both ship glibc 2.39. Consequence: the
          # Linux binaries require glibc >= 2.38 — documented in the README.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # No x86_64-apple-darwin: GitHub is winding down Intel `macos-13`
          # runners, so those jobs starve in the queue (the "24h hang").
          # Apple Silicon covers the current Mac fleet; Intel-Mac users
          # `cargo install` from source (install.sh tells them so).
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The web panel is embedded into the binary by `crates/wingman-cli/
      # build.rs`, which substitutes a placeholder page when `panel/dist` is
      # absent so a clone without node still compiles. That fallback is what
      # makes this step mandatory: without it every released binary would
      # silently serve "the web UI was not built" and nothing would fail.
      # `ui_bundle_is_embedded` (run by the `web-ui` CI job) is the assertion;
      # this is the build that makes it true for the artifact we ship.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Build the web panel
        working-directory: panel
        run: npm ci && npm run build
      # taiki-e's action builds the binary natively for the runner's target,
      # archives it, generates a SHA256 checksum, and uploads everything to
      # the release for this tag. `archive` fixes the asset name so
      # install.sh can predict the download URL.
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: wingman
          target: ${{ matrix.target }}
          archive: wingman-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # The desktop notifier (decision 0019). It is a separate cargo workspace with
  # its own frontend, so it cannot ride `upload-rust-binary-action` alongside
  # the CLI: the bundle is produced by the Tauri CLI, not by cargo, and the
  # artifact is an installer rather than an archived binary.
  #
  # `continue-on-error` is the load-bearing part. The CLI binaries above are
  # what `install.sh` serves; a bundler that breaks — a webkit dependency
  # renamed, an AppImage tool that will not fetch — must never withhold them.
  # A failed leg means that platform has no installer on the release, which is
  # exactly where it was before this job existed.
  notifier-bundle:
    needs: create-release
    name: notifier ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # Apple silicon only, for the same reason as the CLI matrix: the
          # Intel runners starve in the queue.
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      # Only Linux needs the webview headers; Windows has WebView2 in-box and
      # macOS has WKWebView. Same list the `desktop-notifier` CI job installs.
      - name: System webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      # Both npm projects: the CLI lives beside tauri.conf.json, and the
      # frontend it builds via `beforeBuildCommand` is its own project under ui/.
      - name: Install the Tauri CLI and the UI
        run: |
          npm --prefix desktop/notifier ci
          npm --prefix desktop/notifier/ui ci
      # Soft failure on purpose. `tauri build` walks its target list in order,
      # so on Linux the `.deb` is already on disk by the time the AppImage step
      # runs; letting a non-zero exit stop the job here would throw away a
      # bundle that built fine. The upload step below fails loudly if *nothing*
      # was produced, which is the case that actually means something broke.
      - name: Bundle
        continue-on-error: true
        run: npm --prefix desktop/notifier run bundle
      # Tauri names its output after the product and version — "Wingman
      # Notify_0.3.0_x64-setup.exe" — which percent-encodes in a download URL
      # and does not say which target it is for. Rename to the CLI's
      # convention so the assets read as one set, and checksum them the same
      # way `upload-rust-binary-action` does.
      - name: Rename, checksum and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          found=0
          # -print0 and a null-delimited read: the source names contain spaces.
          while IFS= read -r -d '' f; do
            case "$f" in
              *.exe|*.dmg|*.deb|*.AppImage) ;;
              *) continue ;;
            esac
            ext="${f##*.}"
            cp "$f" "$out/wingman-notify-$TARGET.$ext"
            found=$((found + 1))
          done < <(find desktop/notifier/target/release/bundle -type f -print0)
          if [ "$found" -eq 0 ]; then
            echo "no bundle produced for $TARGET" >&2
            exit 1
          fi
          cd "$out"
          # macOS ships `shasum`, not `sha256sum`.
          sha() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            else
              shasum -a 256 "$1"
            fi
          }
          for f in *; do
            sha "$f" > "$f.sha256"
          done
          gh release upload "${GITHUB_REF_NAME}" ./* --clobber --repo "$GITHUB_REPOSITORY"
