name: ci

# Build, lint, and test the workspace on every PR and every push to main.
# This is the required status check for the protected `main` branch.

on:
  pull_request:
  push:
    branches: [main]

# Cancel a stale run when new commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (tags are mutable, and a
# compromised upstream tag would run in a workflow that can publish
# releases). Dependabot's github-actions ecosystem keeps them current.
#
# `dtolnay/rust-toolchain` is the deliberate exception: it selects the
# toolchain *by ref name* (`@stable`, `@1.88`), so pinning it to a SHA
# would silently change which Rust it installs.

env:
  CARGO_TERM_COLOR: always

jobs:
  matrix-test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Test on every platform we ship a release binary for, so cross-
        # platform code (child-process teardown, detached runs, path handling)
        # is actually exercised — not just built at release time.
        #   - ubuntu-24.04 ships glibc 2.39: wingman embeds ONNX Runtime
        #     (fastembed -> ort), whose prebuilt binary needs glibc >= 2.38 to
        #     link — same floor as the release build.
        #   - macos-14 is Apple Silicon; windows-latest is x86_64-msvc.
        os: [ubuntu-24.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # Formatting is fast, platform-independent, and always fixable, so it gates
  # `main` via the aggregate `test` job below.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt (check)
        run: cargo fmt --all --check

  # MSRV check: verify the workspace still compiles on its declared floor
  # (rust-version = "1.88"). 1.88 is the real floor today — the dependency tree
  # (darling 0.23 → 1.88, icu 2.2 → 1.86, built → 1.87) pulls it up. Required
  # again (see the aggregate below) so the declared MSRV can't silently drift.
  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88
      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo check on MSRV
        run: cargo check --workspace

  # Syntax-check the install scripts. `install.ps1` shipped broken once: it was
  # UTF-8 without a BOM, PowerShell 5.1 read it as the ANSI codepage, and an
  # em-dash decoded to a character PowerShell accepts as a string terminator —
  # so the whole script failed to parse and the Windows install path was dead.
  # This must run under `powershell` (5.1), not `pwsh`, or it won't reproduce.
  scripts:
    name: install scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse PowerShell scripts (5.1)
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null; $t = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$t, [ref]$e) | Out-Null
            if ($e -and $e.Count -gt 0) {
              $failed = $true
              $e | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Reject non-ASCII in .ps1 (PS 5.1 misdecodes it)
        shell: powershell
        run: |
          $bad = Get-ChildItem -Recurse -Filter *.ps1 | Where-Object {
            (Get-Content $_.FullName -Raw).ToCharArray() | Where-Object { [int]$_ -gt 127 }
          }
          if ($bad) {
            $bad | ForEach-Object { Write-Host "::error file=$($_.FullName)::contains non-ASCII; keep .ps1 ASCII-only" }
            exit 1
          }

  # install.sh gets its own Linux job: the PowerShell checks above need
  # windows-latest for PS 5.1, but install.sh deliberately refuses to run on
  # Windows (it tells you to use install.ps1), so shell-checking it there fails
  # by design.
  scripts-posix:
    name: install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Syntax + dry run
        run: |
          sh -n scripts/install.sh
          DRY_RUN=1 sh scripts/install.sh

  # Advisory scan, and a REQUIRED check (see the aggregate below): a new
  # RUSTSEC advisory fails the build. Everything we knowingly tolerate is
  # listed in .cargo/audit.toml, each with a reason and a way out — so a red X
  # here means something genuinely new, not a standing wart.
  #
  # cargo-audit, not `cargo deny check advisories`: cargo-deny does not flag
  # the `unsound` advisories currently open against lru, so it would quietly
  # cover less. The two tools are not interchangeable here.
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  # Type-check and bundle the VS Code extension so its TypeScript can't rot
  # silently (it lives in its own npm toolchain, separate from the Rust build).
  # Informational: a separate ecosystem shouldn't block Rust PRs.
  vscode:
    name: vscode-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: editors/vscode
        run: npm install
      - name: Type-check
        working-directory: editors/vscode
        run: npx tsc --noEmit
      - name: Bundle
        working-directory: editors/vscode
        run: npm run build

  # License + duplicate-dependency + source policy via cargo-deny. Advisories
  # are checked by the `audit` job above, which is required; this one stays
  # informational until `multiple-versions` flips to "deny" (pending the
  # reqwest unify).
  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses bans sources
          # The action defaults `arguments` to `--all-features`, which
          # overrides `[graph] all-features = false` in deny.toml and drags the
          # optional `chrome` feature's GPL dependency back into the check.
          # Override it so CI checks the same graph the release binary ships.
          arguments: --workspace

  # Line coverage via cargo-llvm-cov. Informational: emits an lcov artifact and
  # a summary, does not fail the build on a coverage threshold.
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          # The tool used to be selected by the tag (`@cargo-llvm-cov`);
          # pinning to a SHA drops that, so name it explicitly.
          tool: cargo-llvm-cov
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Coverage summary
        run: cargo llvm-cov --workspace --summary-only
      - name: Upload lcov artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov
          path: lcov.info

  # Aggregate gate: this is the single required status check on `main`. It
  # passes only when every matrix leg AND formatting AND the MSRV check AND the
  # advisory scan passed, so the branch protection rule ("test") keeps working
  # regardless of which platforms the matrix runs.
  test:
    name: test
    needs: [matrix-test, fmt, msrv, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        run: |
          if [ "${{ needs.matrix-test.result }}" != "success" ]; then
            echo "matrix tests did not all succeed: ${{ needs.matrix-test.result }}"
            exit 1
          fi
          if [ "${{ needs.fmt.result }}" != "success" ]; then
            echo "rustfmt check failed: ${{ needs.fmt.result }}"
            exit 1
          fi
          if [ "${{ needs.msrv.result }}" != "success" ]; then
            echo "MSRV (1.88) check failed: ${{ needs.msrv.result }}"
            exit 1
          fi
          if [ "${{ needs.audit.result }}" != "success" ]; then
            echo "advisory scan failed: ${{ needs.audit.result }}"
            echo "Triage it, then add a deny.toml ignore with a reason if it is tolerable."
            exit 1
          fi
