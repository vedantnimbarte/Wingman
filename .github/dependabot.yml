version: 2

updates:
  # Rust dependencies. Grouped so a routine week is one PR rather than twenty.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]

  # GitHub Actions. This is the half that matters most: actions are currently
  # pinned to commit SHAs for supply-chain reasons, and without Dependabot a
  # pinned SHA is a dependency nobody ever updates.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # `dtolnay/rust-toolchain@1.88` is not a dependency pin — the ref *is*
      # the toolchain, and it is deliberately the same 1.88 as
      # `rust-version` in the workspace Cargo.toml. Dependabot reads it as a
      # version tag and proposes the newest release, which would quietly
      # point the MSRV job at a toolchain that is not the MSRV: the job keeps
      # passing while proving nothing about the version we promise to support.
      # Raising the floor is a decision to make in Cargo.toml first, and this
      # ref follows it by hand.
      - dependency-name: dtolnay/rust-toolchain

  # The notifier is a separate cargo workspace with its own lockfile (decision
  # 0018), so the root cargo entry above does not reach it. Without this it is
  # the one dependency tree in the repo nobody ever updates — and it is the one
  # holding a webview.
  - package-ecosystem: cargo
    directory: "/desktop/notifier"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]

  # ...and its UI has its own npm toolchain, like the extension below.
  - package-ecosystem: npm
    directory: "/desktop/notifier/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # The VS Code extension has its own npm toolchain.
  - package-ecosystem: npm
    directory: "/editors/vscode"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
