[package]
name = "wingman-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Configuration loading and merging for wingman"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
directories = { workspace = true }
keyring = { workspace = true }
sha2 = { workspace = true }
schemars = { workspace = true, optional = true }

[features]
default = []
# Derive JSON Schema for every config type, so `wingman serve` can emit a
# schema the web panel generates settings forms from. Off by default: only the
# CLI needs it, and the other crates that depend on this one should not pay for
# a proc-macro they never use.
schema = ["dep:schemars"]

[dev-dependencies]
tempfile = "3"
