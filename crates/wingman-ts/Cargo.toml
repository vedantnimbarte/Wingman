[package]
name = "wingman-ts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tree-sitter wrappers: language detection, symbol extraction, semantic chunking, outline."

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }

# Tree-sitter and grammars are gated behind the `treesitter` feature so the
# workspace continues to build (and tests run) without the C toolchain
# overhead when callers don't need parsing.
#
# Held at 0.26: 0.27 declares Rust 1.90, above the workspace MSRV. Grammars
# link through the `tree-sitter-language` shim, so they no longer have to
# match the runtime's minor version.
tree-sitter = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
# fwcd's `tree-sitter-kotlin` never moved past the 0.22 ABI;
# `tree-sitter-kotlin-ng` is the maintained grammar on the shim.
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-highlight = { version = "0.26", optional = true }

[features]
default = ["treesitter"]
treesitter = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-java",
    "dep:tree-sitter-kotlin-ng",
]
highlight = ["treesitter", "dep:tree-sitter-highlight"]
